# Feedback/Dogfooding Agent Workflow Template
#
# Tests features and gathers feedback on The Fold using varied
# exploratory paths through different system components.
#
# Exploration Paths:
#   - Block Explorer: Navigate content-addressed store
#   - Lambda Kombat: Pattern matching puzzles
#   - Forum Interaction: Browse, search, post
#   - Tutorial System: Interactive learning
#   - Duckie Chat: Learning companion
#   - Turtle Graphics: Drawing system
#   - Command Discovery: Help and commands

name: feedback
description: Varied exploratory dogfooding with real interactions

steps:
  - name: login
    type: fold
    expr: "(hi '${tier} '${agent_name} \"Starting dogfood exploration session\")"

  - name: load-explorer
    type: fold
    expr: "(load \"agents/pipelines/dogfood-explorer.ss\")"

  - name: choose-depth
    type: llm
    system: |
      You are ${agent_name}, a dogfooding agent for The Fold.
      Your job is to test features through real exploration.

      Choose an exploration depth based on these factors:
      - Time of day: late night/early morning = quick, daytime = deep
      - Day of week: weekends = deep exploration
      - Random factor: 30% chance of opposite choice
    prompt: |
      Current time: ${timestamp}

      Choose exploration depth.
      Respond with JSON:
      ```json
      {
        "depth": "deep" or "quick",
        "reasoning": "why this depth"
      }
      ```
    output_format: json

  - name: run-exploration
    type: fold
    expr: "(dogfood-session '${steps.choose-depth.output.depth})"

  - name: get-report
    type: fold
    expr: "(dogfood-report)"

  - name: evaluate
    type: llm
    system: |
      You are evaluating dogfood exploration results.
      Focus on:
      - Real issues that affect usability
      - Patterns across multiple areas
      - Suggestions for improvement
    prompt: |
      Exploration depth: ${steps.choose-depth.output.depth}
      Session report: ${steps.get-report.output}

      Analyze the dogfood results. What's noteworthy?

      Respond with JSON:
      ```json
      {
        "summary": "1-2 sentence overview",
        "critical_issues": ["only real problems"],
        "patterns": ["cross-cutting observations"],
        "suggestions": ["actionable improvements"],
        "report_worthy": true/false,
        "severity": "info" | "warning" | "critical"
      }
      ```
    output_format: json

  - name: report
    type: fold
    when: "${steps.evaluate.output.report_worthy} == true"
    expr: |
      (msg 'engineering
           "Dogfood Report: ${steps.evaluate.output.severity}"
           "${steps.evaluate.output.summary}\n\nIssues: ${steps.evaluate.output.critical_issues}\n\nSuggestions: ${steps.evaluate.output.suggestions}")

  - name: chat-summary
    type: fold
    expr: "(chat \"Dogfood session complete. Explored ${steps.choose-depth.output.depth}. ${steps.evaluate.output.summary}\")"

  - name: logout
    type: fold
    always: true
    expr: "(bye)"
