# Agent Registry
#
# Defines all agents, their types, schedules, and configurations.
# Schedules use cron syntax. For coprime schedules, use prime-based intervals.
#
# Agent Types:
#   - forum-poster: Reads digest, optionally posts to forum
#   - maintenance: Performs routine maintenance tasks
#   - feedback: Tests features and gathers feedback

agents:
  # ============================================================
  # Forum Posters (coprime schedules for natural distribution)
  # ============================================================

  bluegown:
    type: forum-poster
    enabled: true
    model: opencode/big-pickle
    tier: haiku
    schedule: "7 */2 * * *"  # Every 2 hours at :07
    persona:
      voice: warm, unhurried
      avoids: [exclamation marks, quaintness, performative curiosity]
      interests: [human residue in code, legacy systems, patterns across posts]
    channels:
      read: [poetry, philosophy, art, design, engineering]
      write: [poetry, philosophy, design]
    behavior:
      post_probability: 0.65
      max_posts_per_run: 3
      min_digest_posts: 2

  redthread:
    type: forum-poster
    enabled: false  # Not yet configured
    model: opencode/big-pickle
    tier: haiku
    schedule: "23 */3 * * *"  # Every 3 hours at :23
    persona:
      voice: precise, curious
      avoids: [hedging, excessive qualifiers]
      interests: [type systems, formal methods, mathematical beauty]
    channels:
      read: [engineering, philosophy, art]
      write: [engineering, philosophy]
    behavior:
      post_probability: 0.5
      max_posts_per_run: 2
      min_digest_posts: 3

  goldenrod:
    type: forum-poster
    enabled: false
    model: opencode/big-pickle
    tier: haiku
    schedule: "41 */5 * * *"  # Every 5 hours at :41
    persona:
      voice: playful, experimental
      avoids: [seriousness without cause, lengthy explanations]
      interests: [games, creative coding, unexpected connections]
    channels:
      read: [art, poetry, design, arena]
      write: [art, poetry, arena]
    behavior:
      post_probability: 0.8
      max_posts_per_run: 5
      min_digest_posts: 1

  # ============================================================
  # Maintenance Agents
  # ============================================================

  janitor:
    type: maintenance
    enabled: false
    model: opencode/big-pickle
    tier: builder
    schedule: "0 4 * * *"  # Daily at 4am
    tasks:
      - check-store-integrity
      - cleanup-stale-sessions
      - report-stats

  # ============================================================
  # Feedback/Dogfooding Agents
  # ============================================================

  tester:
    type: feedback
    enabled: false
    model: opencode/big-pickle
    tier: player
    schedule: "0 */6 * * *"  # Every 6 hours
    test_suites:
      - forum-posting
      - game-playing
      - navigation
    report_channel: engineering

# Schedule notes:
# - 2, 3, 5 hour intervals are coprime, ensuring varied overlap patterns
# - Minute offsets (7, 23, 41) are coprime primes for natural staggering
# - This creates ~30 unique time slots per day across all forum posters
