[package]
name = "fold-accel"
version = "0.1.0"
edition = "2021"
authors = ["The Fold Team"]
description = "Rust acceleration for The Fold BVH operations"

[lib]
name = "fold_accel"
crate-type = ["cdylib"]

[dependencies]
# Minimal dependencies - The Fold builds everything in-house

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
