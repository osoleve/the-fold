<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Fold - Block Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>The Fold</h1>
        <nav>
            <button class="nav-btn active" data-view="blocks">Blocks</button>
            <button class="nav-btn" data-view="graph">Graph</button>
            <button class="nav-btn" data-view="heads">Heads</button>
        </nav>
        <div class="search-box">
            <input type="search" id="search" placeholder="Search blocks...">
            <button id="search-btn">Search</button>
        </div>
    </header>

    <main>
        <aside id="stats">
            <h3>Store Stats</h3>
            <div class="stat-grid">
                <div class="stat">
                    <span class="stat-value" id="stat-blocks">-</span>
                    <span class="stat-label">Blocks</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="stat-pinned">-</span>
                    <span class="stat-label">Pinned</span>
                </div>
                <div class="stat">
                    <span class="stat-value" id="stat-tags">-</span>
                    <span class="stat-label">Tags</span>
                </div>
            </div>
            <div id="tag-list"></div>
        </aside>

        <section id="content">
            <div id="blocks-view" class="view active">
                <div class="toolbar">
                    <select id="tag-filter">
                        <option value="">All tags</option>
                    </select>
                    <button id="prev-page" disabled>&lt; Prev</button>
                    <span id="page-info">Page 1</span>
                    <button id="next-page">Next &gt;</button>
                </div>
                <table id="blocks-table">
                    <thead>
                        <tr>
                            <th>Hash</th>
                            <th>Tag</th>
                            <th>Size</th>
                            <th>Refs</th>
                            <th>Pinned</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <div id="graph-view" class="view">
                <div class="toolbar">
                    <input type="text" id="graph-root" placeholder="Enter block hash...">
                    <button id="graph-load">Load Graph</button>
                    <label>
                        Depth: <input type="number" id="graph-depth" value="2" min="1" max="5">
                    </label>
                    <button id="graph-orphans">Show Orphans</button>
                    <button id="graph-popular">Show Popular</button>
                </div>
                <canvas id="graph-canvas"></canvas>
            </div>

            <div id="heads-view" class="view">
                <table id="heads-table">
                    <thead>
                        <tr>
                            <th>Name</th>
                            <th>Hash</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <aside id="detail">
            <h3>Block Detail</h3>
            <div id="detail-content">
                <p class="placeholder">Select a block to view details</p>
            </div>
        </aside>
    </main>

    <script src="app.js"></script>
</body>
</html>
