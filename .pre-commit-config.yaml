# Pre-commit hooks for The Fold
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  # Local hooks (no external dependencies)
  - repo: local
    hooks:
      # Run the test suite before commit
      - id: test-suite
        name: Run test suite
        entry: scheme --script test-all.ss
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Debug print check disabled - too many false positives from legitimate output
      # (module stats, parser tracing, REPL output, etc.)

      # Ensure manifests are valid S-expressions
      - id: validate-manifests
        name: Validate manifest.sexp files
        entry: bash -c 'for f in lattice/*/manifest.sexp; do scheme -q --script -e "(load \"$f\")" 2>/dev/null || echo "Invalid: $f"; done'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: manifest\.sexp$

      # Rust: cargo fmt check
      - id: rust-fmt
        name: Check Rust formatting (cargo fmt)
        entry: bash -c 'cd boundary/ffi/rust-accel && cargo fmt --check'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: '\.rs$'

      # Rust: clippy (errors only, warnings allowed)
      - id: rust-clippy
        name: Run Clippy lints
        entry: bash -c 'cd boundary/ffi/rust-accel && cargo clippy --all-targets 2>&1 | grep -q "^error" && exit 1 || exit 0'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: '\.rs$'

      # Rust: cargo check (faster than full build)
      - id: rust-check
        name: Check Rust compiles (cargo check)
        entry: bash -c 'cd boundary/ffi/rust-accel && cargo check'
        language: system
        pass_filenames: false
        stages: [pre-commit]
        files: '\.rs$'

  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'
      - id: end-of-file-fixer
        exclude: '\.md$'
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=500']
      - id: check-merge-conflict
      - id: detect-private-key
