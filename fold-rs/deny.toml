# cargo-deny configuration for The Fold
# https://embarkstudios.github.io/cargo-deny/

[graph]
# Check all features to catch all dependency issues
all-features = true

[output]
feature-depth = 1

# Security advisories - fail on any security issues
[advisories]
ignore = []

# License checking - only allow permissive licenses
[licenses]
# Allow common permissive open source licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",  # Unicode license
    "0BSD",              # Zero-Clause BSD
    "Zlib",              # zlib license
]

confidence-threshold = 0.8

# Clarifications for crates with non-standard license files
[[licenses.clarify]]
crate = "ring"
expression = "ISC AND MIT AND OpenSSL"
license-files = [
    { path = "LICENSE", hash = 0xbd0eed23 }
]

[licenses.private]
ignore = false

# Ban duplicate dependencies and problematic crates
[bans]
# Warn on multiple versions (helps keep dependency tree clean)
multiple-versions = "warn"
# Deny wildcard dependencies
wildcards = "deny"
highlight = "all"

# Skip known duplicates that are hard to resolve
skip = []

# No banned crates yet - add as needed
deny = []

# Source verification
[sources]
# Only allow crates.io
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
