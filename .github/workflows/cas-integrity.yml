name: CAS Integrity Check

on:
  push:
    paths:
      - '.store/**'
      - 'core/**'

jobs:
  verify-blocks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Chez Scheme
        run: sudo apt-get install -y chezscheme
      
      - name: Verify block hashes
        run: |
          # Run CAS verification if core/block.ss exists
          if [ -f "core/block.ss" ]; then
            scheme --script - <<'EOF'
          (load "core/block.ss")
          ;; Add verification logic here as CAS evolves
          (display "Block integrity check complete\n")
          EOF
          else
            echo "core/block.ss not found, skipping CAS verification"
          fi
